name: Update

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [auto, all, test]
        default: auto

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: pub
      - uses: actions/checkout@v6
        with:
          repository: Kifarkis/eb-tracker-src
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          persist-credentials: false
          path: src
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python src/tools/run.py
        env:
          EB_TASK: ${{ inputs.task }}
          EB_TERMS: ${{ secrets.EB_TERMS }}
          EB_PARTNERS: ${{ secrets.EB_PARTNERS }}
          OPS_EMAIL: ${{ secrets.OPS_EMAIL }}
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          EB_FORM_KEY: ${{ vars.EB_FORM_KEY }}
          PUSH_EXPORT_TOKEN: ${{ secrets.PUSH_EXPORT_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CERT_KEY: ${{ secrets.MS_CERT_KEY }}
          MS_CERT_X5T: ${{ secrets.MS_CERT_X5T }}
